  <circle cx="228" cy="7.5" r="5.1" fill="#1A1D22" stroke="#C8CCD2" stroke-width="0.8"/>
  <circle cx="228" cy="7.5" r="3.5" fill="#050608"/>
  <circle cx="226.6" cy="6.2" r="1" fill="#3C4148"/>
  <g stroke="#2A2E33" stroke-width="1.5" stroke-linecap="round">
    <path d="M0 175.2h6M0 226.8h6M0 235.2h6M0 286.8h6"/>
    <path d="M450 197.2h6M450 262.8h6"/>
