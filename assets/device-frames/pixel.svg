<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -6 478 980" width="478" height="980" fill="none">
  <title>Pixel frame</title>
  <desc>Screen well 430×932 at canvas (23, 28), radius 36. Punch-hole camera sits in the top bezel and does not cover the screenshot.</desc>
  <defs>
    <linearGradient id="pixel-metal" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="456" y2="28">
      <stop offset="0" stop-color="#F5F6F8"/>
      <stop offset="0.07" stop-color="#C9CDD3"/>
      <stop offset="0.16" stop-color="#8E939B"/>
      <stop offset="0.38" stop-color="#B4B8BF"/>
      <stop offset="0.62" stop-color="#9AA0A8"/>
      <stop offset="0.84" stop-color="#7A8088"/>
      <stop offset="0.94" stop-color="#D5D8DC"/>
      <stop offset="1" stop-color="#F7F8FA"/>
    </linearGradient>
    <linearGradient id="pixel-btn-l" gradientUnits="userSpaceOnUse" x1="-8" y1="0" x2="4" y2="0">
      <stop offset="0" stop-color="#FBFCFD"/>
      <stop offset="0.45" stop-color="#8B9098"/>
      <stop offset="1" stop-color="#4E545C"/>
    </linearGradient>
    <linearGradient id="pixel-btn-r" gradientUnits="userSpaceOnUse" x1="452" y1="0" x2="464" y2="0">
      <stop offset="0" stop-color="#4E545C"/>
      <stop offset="0.55" stop-color="#8B9098"/>
      <stop offset="1" stop-color="#FBFCFD"/>
    </linearGradient>
  </defs>
  <!-- Left: volume. Right: power. No Action button. -->
  <g stroke="#2A2E33" stroke-width="0.9">
    <rect x="-8" y="176" width="12" height="50" rx="1.6" fill="url(#pixel-btn-l)"/>
    <rect x="-8" y="236" width="12" height="50" rx="1.6" fill="url(#pixel-btn-l)"/>
    <rect x="452" y="198" width="12" height="64" rx="1.6" fill="url(#pixel-btn-r)"/>
  </g>
  <path fill="url(#pixel-metal)" stroke="#1C1F24" stroke-opacity="0.55" stroke-width="1.15" fill-rule="evenodd" d="M50 0H406A50 50 0 0 1 456 50V918A50 50 0 0 1 406 968H50A50 50 0 0 1 0 918V50A50 50 0 0 1 50 0ZM49 22H407A36 36 0 0 1 443 58V918A36 36 0 0 1 407 954H49A36 36 0 0 1 13 918V58A36 36 0 0 1 49 22Z"/>
  <path fill="#07080A" fill-rule="evenodd" d="M49 15H407A43 43 0 0 1 450 58V918A43 43 0 0 1 407 961H49A43 43 0 0 1 6 918V58A43 43 0 0 1 49 15ZM49 22H407A36 36 0 0 1 443 58V918A36 36 0 0 1 407 954H49A36 36 0 0 1 13 918V58A36 36 0 0 1 49 22Z"/>
  <path stroke="#F4F6F8" stroke-opacity="0.55" stroke-width="1" d="M64 1.2H392"/>
