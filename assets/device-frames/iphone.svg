<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -6 480 972" width="480" height="972" fill="none">
  <title>iPhone frame</title>
  <desc>Screen well 430×932 at canvas (24, 20), radius 47. No Dynamic Island — it is already in the screenshot.</desc>
  <defs>
